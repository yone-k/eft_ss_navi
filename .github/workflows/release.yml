name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore application and launcher
        shell: pwsh
        run: |
          dotnet restore src/EftSsNavi.App/EftSsNavi.App.csproj -r win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore src/EftSsNavi.Launcher/EftSsNavi.Launcher.csproj -r win-x64

      - name: Publish application
        run: dotnet publish src/EftSsNavi.App/EftSsNavi.App.csproj -c Release -r win-x64 --no-restore -o publish/app -p:Version=${{ steps.version.outputs.version }}

      - name: Publish launcher
        run: dotnet publish src/EftSsNavi.Launcher/EftSsNavi.Launcher.csproj -c Release -r win-x64 --no-restore -o publish -p:Version=${{ steps.version.outputs.version }}

      - name: Add user documentation
        shell: pwsh
        run: Copy-Item -LiteralPath README.md -Destination publish/README.md

      - name: Validate publish output
        shell: pwsh
        run: |
          $expectedRootEntries = @(
            'EftSsNavi.exe'
            'README.md'
            'app'
          )
          $actualRootEntries = Get-ChildItem -LiteralPath publish |
            ForEach-Object Name |
            Sort-Object
          $unexpectedRootEntries = Compare-Object `
            -ReferenceObject ($expectedRootEntries | Sort-Object) `
            -DifferenceObject $actualRootEntries
          if ($unexpectedRootEntries) {
            Write-Error "Unexpected publish root entries: $($actualRootEntries -join ', ')"
            exit 1
          }

          $requiredFiles = @(
            'publish/README.md'
            'publish/EftSsNavi.exe'
            'publish/app/EftSsNavi.App.exe'
            'publish/app/EftSsNavi.Sharing.dll'
            'publish/app/SIPSorcery.dll'
            'publish/app/THIRD-PARTY-NOTICES.md'
            'publish/app/Assets/Maps/catalog.json'
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              Write-Error "Required publish output is missing: $file"
              exit 1
            }
          }

          $symbols = Get-ChildItem -LiteralPath publish -Filter '*.pdb' -Recurse -File
          if ($symbols) {
            Write-Error "Publish output contains PDB files: $($symbols.FullName -join ', ')"
            exit 1
          }

          $launcherVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo(
            (Resolve-Path -LiteralPath 'publish/EftSsNavi.exe')).FileVersion
          $applicationVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo(
            (Resolve-Path -LiteralPath 'publish/app/EftSsNavi.App.exe')).FileVersion
          if ($launcherVersion -ne $applicationVersion) {
            Write-Error "Launcher and application versions differ: $launcherVersion != $applicationVersion"
            exit 1
          }

      - name: Create release archive
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath EftSsNavi-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: EftSsNavi-win-x64.zip
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## 動作環境

            - Windows 11 x64
            - [.NET 10 Runtime（x64）](https://dotnet.microsoft.com/download/dotnet/10.0)
            - [Windows App SDK Runtime 2.4（x64）](https://learn.microsoft.com/windows/apps/windows-app-sdk/downloads)
            - [Microsoft Visual C++ Redistributable（x64）](https://aka.ms/vs/17/release/vc_redist.x64.exe)

            ## インストールと起動

            1. 必要なランタイムをインストールします。
            2. 配布ZIPをダウンロードして展開します。
            3. 展開先のルートにある`EftSsNavi.exe`を起動します。

            `app`フォルダー内のファイルだけを移動せず、展開した構成を保って利用してください。v0.2.2以前から更新する場合は、古いフォルダーへ上書きせず、新しいZIPを別のフォルダーへ展開してください。
          draft: false
          prerelease: false
