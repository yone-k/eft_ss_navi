name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Core tests
        run: dotnet restore tests/EftSsNavi.Core.Tests/EftSsNavi.Core.Tests.csproj

      - name: Run Core tests
        run: dotnet test tests/EftSsNavi.Core.Tests/EftSsNavi.Core.Tests.csproj -c Release --no-restore

      - name: Restore Sharing tests
        run: dotnet restore tests/EftSsNavi.Sharing.Tests/EftSsNavi.Sharing.Tests.csproj

      - name: Run Sharing tests
        run: dotnet test tests/EftSsNavi.Sharing.Tests/EftSsNavi.Sharing.Tests.csproj -c Release --no-restore

      - name: Restore App tests
        run: dotnet restore tests/EftSsNavi.App.Tests/EftSsNavi.App.Tests.csproj -r win-x64

      - name: Run App tests
        run: dotnet test tests/EftSsNavi.App.Tests/EftSsNavi.App.Tests.csproj -c Release -r win-x64 --no-restore

  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore solution
        run: dotnet restore EftSsNavi.slnx

      - name: Build solution
        run: dotnet build EftSsNavi.slnx -c Release --no-restore

  worker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/signaling/package-lock.json

      - name: Install Worker dependencies
        working-directory: workers/signaling
        run: npm ci

      - name: Run Worker tests
        working-directory: workers/signaling
        run: npm test
